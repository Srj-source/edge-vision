<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">IITR TMI - Real-Time Traffic Monitoring and Intelligence</title>
  <desc id="d">Animated traffic scene: vehicles tagged with detection boxes, IDs and estimated speeds drive across a counting line while a traffic light cycles.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.6" stop-color="#0d1f3a"/>
      <stop offset="1" stop-color="#103a4a"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e0b8"/>
      <stop offset="0.5" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4cc9f0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="330" rx="20"/></clipPath>

    <!-- car, 92 x 30, faces right -->
    <g id="car">
      <rect x="0" y="8" width="92" height="22" rx="7" fill="currentColor"/>
      <path d="M20 9 L28 0 H62 L72 9 Z" fill="currentColor"/>
      <path d="M26 9 L31 3 H46 V9 Z M50 9 V3 H60 L67 9 Z" fill="#bfe3ff" opacity="0.9"/>
      <circle cx="22" cy="30" r="7.5" fill="#0a0e1a" stroke="#58607a" stroke-width="2"/>
      <circle cx="70" cy="30" r="7.5" fill="#0a0e1a" stroke="#58607a" stroke-width="2"/>
      <rect x="88" y="14" width="5" height="6" rx="2" fill="#fff4a8"/>
      <rect x="-1" y="14" width="4" height="6" rx="2" fill="#ff3b30"/>
    </g>

    <!-- bus, 150 x 30, faces right -->
    <g id="bus">
      <rect x="0" y="0" width="150" height="30" rx="6" fill="currentColor"/>
      <g fill="#bfe3ff" opacity="0.9">
        <rect x="10" y="6" width="16" height="11" rx="2"/>
        <rect x="32" y="6" width="16" height="11" rx="2"/>
        <rect x="54" y="6" width="16" height="11" rx="2"/>
        <rect x="76" y="6" width="16" height="11" rx="2"/>
        <rect x="98" y="6" width="16" height="11" rx="2"/>
        <rect x="120" y="6" width="16" height="11" rx="2"/>
        <rect x="139" y="6" width="8" height="14" rx="2"/>
      </g>
      <rect x="0" y="22" width="150" height="3" fill="#000" opacity="0.15"/>
      <circle cx="30" cy="30" r="7.5" fill="#0a0e1a" stroke="#58607a" stroke-width="2"/>
      <circle cx="118" cy="30" r="7.5" fill="#0a0e1a" stroke="#58607a" stroke-width="2"/>
      <rect x="146" y="21" width="4" height="5" rx="2" fill="#fff4a8"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="330" fill="url(#bg)"/>
    <rect width="1000" height="330" fill="url(#grid)"/>

    <!-- twinkling data dots -->
    <g fill="#8fe9ff">
      <circle cx="590" cy="40" r="1.8"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="78" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="32" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="96" r="1.5"><animate attributeName="opacity" values="1;0.15;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="50" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="118" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="124" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- LIVE pill -->
    <g transform="translate(40 24)">
      <rect width="118" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="16" cy="13" r="5" fill="#ff4d4f">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="29" y="17.5" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#e6f1ff" letter-spacing="1.5">LIVE · AI</text>
    </g>

    <!-- title -->
    <text x="40" y="106" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="url(#ttl)" filter="url(#glow)" letter-spacing="2">IITR TMI
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="42" y="137" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#cfe3ff" opacity="0.92">Real-Time Traffic Monitoring &amp; Intelligence
      <animate attributeName="opacity" values="0;0.92" dur="1.8s" fill="freeze"/>
    </text>

    <!-- traffic light -->
    <g transform="translate(900 24)">
      <rect width="52" height="118" rx="12" fill="#0a0e1a" stroke="#2b3550" stroke-width="2"/>
      <circle cx="26" cy="26" r="13" fill="#ff3b30" filter="url(#glow)">
        <animate attributeName="opacity" calcMode="discrete" values="1;0.15" keyTimes="0;0.4" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="26" cy="59" r="13" fill="#ffcc00" filter="url(#glow)">
        <animate attributeName="opacity" calcMode="discrete" values="0.15;1" keyTimes="0;0.85" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="26" cy="92" r="13" fill="#34c759" filter="url(#glow)">
        <animate attributeName="opacity" calcMode="discrete" values="0.15;1;0.15" keyTimes="0;0.4;0.85" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- road -->
    <rect x="0" y="160" width="1000" height="150" fill="#131a2b"/>
    <rect x="0" y="160" width="1000" height="3" fill="#2f3b5c"/>
    <rect x="0" y="307" width="1000" height="3" fill="#2f3b5c"/>
    <line x1="0" y1="234" x2="1000" y2="234" stroke="#e8eefc" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="30 22"/>

    <!-- scan sweep -->
    <rect y="160" width="140" height="150" fill="url(#scan)">
      <animate attributeName="x" from="-140" to="1000" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- counting line -->
    <line x1="520" y1="160" x2="520" y2="310" stroke="#00e0b8" stroke-width="3" stroke-dasharray="10 8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <text x="520" y="153" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#00e0b8" letter-spacing="2">COUNT LINE</text>

    <!-- lane A: left to right -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-160 188" to="1060 188" dur="8s" repeatCount="indefinite"/>
      <use href="#car" color="#ff5a5f"/>
      <rect x="-7" y="-7" width="106" height="50" rx="5" fill="none" stroke="#00ff9d" stroke-width="2"/>
      <rect x="-7" y="-25" width="124" height="17" rx="3" fill="#00ff9d"/>
      <text x="-2" y="-12.5" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#03210f">car #07 · 52 km/h</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-160 188" to="1060 188" dur="8s" begin="-4s" repeatCount="indefinite"/>
      <use href="#car" color="#4cc9f0"/>
      <rect x="-7" y="-7" width="106" height="50" rx="5" fill="none" stroke="#00ff9d" stroke-width="2"/>
      <rect x="-7" y="-25" width="124" height="17" rx="3" fill="#00ff9d"/>
      <text x="-2" y="-12.5" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#03210f">car #08 · 49 km/h</text>
    </g>

    <!-- lane B: right to left -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="1060 264" to="-220 264" dur="12s" begin="-2s" repeatCount="indefinite"/>
      <g transform="translate(150 0) scale(-1 1)"><use href="#bus" color="#ffb703"/></g>
      <rect x="-7" y="-7" width="164" height="50" rx="5" fill="none" stroke="#ffd166" stroke-width="2"/>
      <rect x="-7" y="-25" width="124" height="17" rx="3" fill="#ffd166"/>
      <text x="-2" y="-12.5" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#2a1d00">bus #03 · 31 km/h</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="1060 264" to="-220 264" dur="12s" begin="-8s" repeatCount="indefinite"/>
      <g transform="translate(92 0) scale(-1 1)"><use href="#car" color="#a78bfa"/></g>
      <rect x="-7" y="-7" width="106" height="50" rx="5" fill="none" stroke="#00ff9d" stroke-width="2"/>
      <rect x="-7" y="-25" width="124" height="17" rx="3" fill="#00ff9d"/>
      <text x="-2" y="-12.5" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#03210f">car #11 · 34 km/h</text>
    </g>

    <!-- footer strip -->
    <text x="500" y="324" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8fb3d9" opacity="0.65" letter-spacing="3">YOLO  ·  BYTETRACK  ·  OPENCV  ·  PYTHON</text>
  </g>
</svg>
