<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" preserveAspectRatio="none" role="img" aria-label="Animated divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.25" stop-color="#ffcc00"/>
      <stop offset="0.5" stop-color="#34c759"/>
      <stop offset="0.75" stop-color="#00c9a7"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="0" y="2" width="2000" height="4" rx="2" fill="url(#g)"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="5s" repeatCount="indefinite"/>
  </g>
</svg>
